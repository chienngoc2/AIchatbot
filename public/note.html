<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ghi Chú - AI D4C</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Patrick+Hand&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styleNote.css" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body style="margin: 0; overflow: hidden; background: #ffffff !important">
    <div
      class="app-container"
      style="
        display: flex;
        flex-direction: row;
        height: 100vh;
        width: 100vw;
        background: #ffffff !important;
      "
    >
      <!-- SIDEBAR TRÁI -->
      <aside
        class="sidebar sidebar-left"
        style="
          flex: 0 0 260px !important;
          width: 260px !important;
          min-width: 260px !important;
          border-right: 1px solid #e0e0e0;
          background: #ffffff !important;
          z-index: 10;
          margin: 0 !important;
          padding: 0 !important;
          box-sizing: border-box;
          overflow: hidden !important;
        "
      >
        <!-- THÊM BÙA CHÚ TRÀN VIỀN: margin: 0, border-radius: 0, border: none, height: 100vh -->
        <div
          class="sidebar-content bg-image left-bg"
          style="
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 15px;
            height: 100vh !important;
            width: 100% !important;
            margin: 0 !important;
            border-radius: 0 !important;
            border: none !important;
            box-sizing: border-box;
          "
        >
          <button
            class="nav-btn"
            onclick="window.location.href = 'index.html'"
            title="Về trang Chat chính"
          >
            Trang chủ (Chat AI)
          </button>

          <button
            class="nav-btn active"
            style="
              background: #4285f4 !important;
              color: white !important;
              border: none !important;
              padding: 12px 16px;
              border-radius: 12px;
              cursor: pointer;
              font-size: 1.05rem;
              font-weight: 500;
            "
            onclick="window.location.href = 'note.html'"
            title="Mở kho kiến thức AI"
          >
            Ghi Chú AI
          </button>

          <button
            class="nav-btn"
            onclick="window.location.href = 'vocab.html'"
            title="Học Flashcard"
          >
            Luyện Tập Từ Vựng
          </button>

          <button
            class="nav-btn"
            onclick="window.location.href = 'flashcard.html'"
            title="Học thẻ ghi nhớ"
          >
            Thẻ Ghi Nhớ (Flashcard)
          </button>
        </div>
      </aside>

      <!-- KHU VỰC CHÍNH (GIỮA) -->
      <div
        style="
          flex: 1;
          background: #ffffff !important;
          overflow-y: auto;
          display: flex;
          flex-direction: column;
          padding: 0 !important;
          margin: 0 !important;
        "
      >
        <main
          class="center-stage"
          style="
            width: 100% !important;
            max-width: 100% !important;
            min-height: 100%;
            margin: 0 !important;
            padding: 40px !important;
            box-sizing: border-box;
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #ffffff !important;
            border: none !important;
            box-shadow: none !important;
            border-radius: 0 !important;
          "
        >
          <div
            class="header-widget"
            style="
              text-align: center;
              margin-bottom: 20px;
              background: transparent !important;
              box-shadow: none !important;
            "
          >
            <h2
              class="app-title"
              style="
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                margin: 0;
                font-family: &quot;Inter&quot;, sans-serif;
              "
            >
              <img
                src="https://cdn-icons-png.flaticon.com/512/3238/3238016.png"
                alt="Logo"
                width="40"
                height="40"
              />
              Trang Nhật Ký
            </h2>
          </div>

          <div
            id="editor-container"
            style="
              display: flex;
              flex-direction: column;
              gap: 20px;
              flex: 1;
              background: transparent !important;
              padding: 0 !important;
              border: none !important;
              box-shadow: none !important;
            "
          >
            <input
              type="text"
              id="fileNameInput"
              class="note-title"
              placeholder="Chủ đề (VD: So-thich-cua-toi)..."
              autocomplete="off"
              style="
                width: 100%;
                padding: 16px;
                font-size: 1.1rem;
                border: 1px solid #d1d5db;
                border-radius: 8px;
                box-sizing: border-box;
                background: #ffffff;
                outline: none;
                font-family: &quot;Inter&quot;, sans-serif;
                transition: border 0.3s;
              "
              onfocus="this.style.border = '1px solid #4285f4'"
              onblur="this.style.border = '1px solid #d1d5db'"
            />

            <textarea
              id="noteInput"
              class="note-body"
              placeholder="Viết những suy nghĩ của bạn vào đây để AI nhớ mãi..."
              style="
                width: 100%;
                flex: 1;
                min-height: 400px;
                padding: 16px;
                font-size: 1.1rem;
                border: 1px solid #d1d5db;
                border-radius: 8px;
                box-sizing: border-box;
                resize: none;
                background: #ffffff;
                line-height: 1.6;
                outline: none;
                font-family: &quot;Inter&quot;, sans-serif;
                transition: border 0.3s;
              "
              onfocus="this.style.border = '1px solid #4285f4'"
              onblur="this.style.border = '1px solid #d1d5db'"
            ></textarea>
          </div>

          <!-- THANH CÔNG CỤ -->
          <div
            class="control-dock"
            style="
              margin-top: 20px;
              padding: 0 !important;
              display: flex;
              justify-content: flex-end;
              align-items: center;
              background: transparent !important;
              border: none !important;
              box-shadow: none !important;
            "
          >
            <button
              class="save-btn"
              id="saveBtn"
              onclick="saveNote()"
              style="
                background: #4285f4 !important;
                color: white !important;
                border: none !important;
                padding: 8px 16px !important;
                border-radius: 6px !important;
                font-weight: 600;
                font-size: 0.95rem;
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                gap: 6px;
                transition: 0.2s;
              "
            >
              <svg
                viewBox="0 0 24 24"
                width="16"
                height="16"
                fill="currentColor"
              >
                <path
                  d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"
                />
              </svg>
              Lưu Nhật Ký
            </button>
          </div>
        </main>
      </div>

      <!-- SIDEBAR PHẢI -->
      <aside
        class="sidebar sidebar-right"
        style="
          flex: 0 0 260px !important;
          width: 260px !important;
          min-width: 260px !important;
          border-left: 1px solid #e0e0e0;
          background: #ffffff !important;
          padding: 20px;
          z-index: 10;
          margin: 0 !important;
          box-sizing: border-box;
        "
      >
        <div
          style="
            text-align: center;
            color: #a4b0be;
            font-weight: 500;
            margin-top: 20px;
          "
        >
          COMING SOON
        </div>
      </aside>
    </div>

    <script>
      async function saveNote() {
        const fileNameInput = document.getElementById("fileNameInput");
        const noteInput = document.getElementById("noteInput");
        const saveBtn = document.getElementById("saveBtn");

        const filename = fileNameInput.value.trim();
        const text = noteInput.value.trim();

        if (!text) {
          alert("⚠️ Vui lòng nhập nội dung!");
          return;
        }

        saveBtn.disabled = true;
        saveBtn.innerHTML = "Đang lưu... ⏳";

        try {
          const response = await fetch("/add-note", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text, filename }),
          });

          const result = await response.json();

          if (result.success) {
            alert("✅ Đã lưu thành công!");
            noteInput.value = "";
          } else {
            alert("❌ Lỗi: " + (result.message || "Unknown"));
          }
        } catch (error) {
          alert("❌ Lỗi kết nối server!");
        } finally {
          saveBtn.disabled = false;
          saveBtn.innerHTML = `<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg> Lưu Nhật Ký`;
        }
      }
    </script>
  </body>
</html>
