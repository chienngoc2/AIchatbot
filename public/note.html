<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ghi Chú - AI D4C</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Patrick+Hand&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styleNote.css" />
  </head>

  <body>
    <div class="app-container">
      <aside class="sidebar sidebar-left">
        <div
          style="
            text-align: center;
            color: #a4b0be;
            font-weight: 500;
            margin-top: 20px;
          "
        >
          COMING SOON
        </div>
      </aside>

      <main class="center-stage">
        <div class="header-widget">
          <h2 class="app-title">
            <img
              src="https://cdn-icons-png.flaticon.com/512/3238/3238016.png"
              alt="Logo"
            />
            Trang Nhật Ký
          </h2>
        </div>

        <div id="editor-container">
          <input
            type="text"
            id="fileNameInput"
            class="note-title"
            placeholder="Chủ đề (VD: So-thich-cua-toi)..."
            autocomplete="off"
          />

          <textarea
            id="noteInput"
            class="note-body"
            placeholder="Viết những suy nghĩ của bạn vào đây để AI nhớ mãi..."
          ></textarea>
        </div>

        <div class="control-dock">
          <button class="save-btn" id="saveBtn" onclick="saveNote()">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path
                d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"
              />
            </svg>
            Lưu Nhật Ký
          </button>
        </div>
      </main>

      <aside class="sidebar sidebar-right">
        <button
          class="nav-btn"
          onclick="window.location.href = 'index.html'"
          title="Trở về Chatbot"
        >
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path
              fill="currentColor"
              d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"
            />
          </svg>
          Quay Về Chat
        </button>
      </aside>
    </div>

    <script>
      async function saveNote() {
        const fileNameInput = document.getElementById("fileNameInput");
        const noteInput = document.getElementById("noteInput");
        const saveBtn = document.getElementById("saveBtn");

        const filename = fileNameInput.value.trim();
        const text = noteInput.value.trim();

        if (!text) {
          alert("⚠️ Vui lòng nhập nội dung!");
          return;
        }

        saveBtn.disabled = true;
        saveBtn.innerHTML = "Đang lưu... ⏳";

        try {
          const response = await fetch("/add-note", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text, filename }),
          });

          const result = await response.json();

          if (result.success) {
            alert("✅ Đã lưu thành công!");
            noteInput.value = "";
          } else {
            alert("❌ Lỗi: " + (result.message || "Unknown"));
          }
        } catch (error) {
          alert("❌ Lỗi kết nối server!");
        } finally {
          saveBtn.disabled = false;
          saveBtn.innerHTML = `<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg> Lưu Nhật Ký`;
        }
      }
    </script>
  </body>
</html>
