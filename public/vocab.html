<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Luyện Từ Vựng - AI D4C</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="css/vocab.css" />
  </head>
  <body style="margin: 0; overflow: hidden; background: #ffffff">
    <div
      class="app-container"
      style="display: flex; flex-direction: row; height: 100vh; width: 100vw"
    >
      <!-- SIDEBAR BÊN TRÁI (Đã thêm lại class để hiện ảnh Mèo) -->
      <aside
        class="sidebar sidebar-left"
        style="
          flex: 0 0 250px;
          border-right: 1px solid #e0e0e0;
          background: #ffffff;
          z-index: 10;
        "
      >
        <div
          class="sidebar-content bg-image left-bg"
          style="
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 15px;
            height: 100%;
          "
        >
          <button
            class="nav-btn"
            onclick="window.location.href = 'index.html'"
            title="Về trang Chat chính"
          >
            Trang chủ (Chat AI)
          </button>

          <button
            class="nav-btn"
            onclick="window.location.href = 'note.html'"
            title="Mở kho kiến thức AI"
          >
            Ghi Chú AI
          </button>

          <button
            class="nav-btn active"
            style="
              background: #4285f4;
              color: white;
              border: none;
              padding: 12px 16px;
              border-radius: 12px;
              cursor: pointer;
              font-size: 1.05rem;
              font-weight: 500;
            "
            onclick="window.location.href = 'vocab.html'"
            title="Học Flashcard"
          >
            Luyện Tập Từ Vựng
          </button>
          <button class="nav-btn" onclick="window.location.href = 'flashcard.html'" title="Học thẻ ghi nhớ">
  Thẻ Ghi Nhớ (Flashcard)
</button>
        </div>
      </aside>

      <!-- KHU VỰC CHÍNH (GIỮA): Choán hết không gian, bỏ căn giữa -->
      <div
        style="flex: 1; background: #ffffff; overflow-y: auto; padding: 40px"
      >
        <!-- BẢNG NỘI DUNG: Xóa giới hạn chiều rộng, xóa bóng đổ -->
        <main
          class="vocab-center"
          style="
            width: 100%;
            max-width: none;
            background: transparent;
            padding: 0;
            box-shadow: none;
            border-radius: 0;
            margin: 0;
          "
        >
          <!-- HEADER -->
          <div
            class="vocab-header"
            style="
              border-bottom: 2px solid #f0f0f0;
              padding-bottom: 15px;
              margin-bottom: 20px;
              display: flex;
              justify-content: space-between;
              align-items: center;
            "
          >
            <h2 id="pageTitle" style="margin: 0; color: #2c3e50">
              Nhập Danh Sách Từ Vựng
            </h2>
            <div
              class="score-badge"
              id="scoreDisplay"
              style="
                display: none;
                background: #4285f4;
                color: white;
                padding: 8px 16px;
                border-radius: 20px;
                font-weight: bold;
              "
            >
              Điểm: 0
            </div>
          </div>

          <!-- MÀN HÌNH 1: NHẬP LIỆU & DANH SÁCH BÀI HỌC -->
          <div id="importSection">
            <div class="vocab-input-card">
              <p class="section-desc" style="color: #666; margin-bottom: 10px">
                1. Đặt tên và nhập từ vựng (Cú pháp: <b>Từ Vựng : Nghĩa</b>)
              </p>

              <input
                type="text"
                id="listTitle"
                placeholder="Tên bài (VD: Từ vựng N4 - Bài 1...)"
                class="vocab-title-input"
                style="
                  width: 100%;
                  padding: 12px;
                  margin-bottom: 12px;
                  border: 1px solid #ddd;
                  border-radius: 8px;
                  box-sizing: border-box;
                "
              />
              <textarea
                id="vocabInput"
                placeholder="食べる : Ăn&#10;水 : Nước"
                style="
                  width: 100%;
                  height: 250px;
                  padding: 12px;
                  border: 1px solid #ddd;
                  border-radius: 8px;
                  margin-bottom: 15px;
                  resize: none;
                  box-sizing: border-box;
                "
              ></textarea>

              <button
                onclick="processAndSaveList()"
                class="btn-d4c-primary"
                style="
                  width: 100%;
                  background: #4285f4;
                  color: white;
                  padding: 14px;
                  border: none;
                  border-radius: 8px;
                  font-weight: bold;
                  cursor: pointer;
                "
              >
                💾 Lưu vào DB & Học ngay
              </button>
            </div>

            <div class="saved-lessons-card" style="margin-top: 30px">
              <h3
                class="section-title"
                style="margin-bottom: 15px; color: #333"
              >
                Các bài học đã lưu (Click để luyện tập)
              </h3>
              <div
                id="savedListsContainer"
                class="saved-lists"
                style="display: flex; flex-direction: column; gap: 10px"
              >
                <p style="color: #888; text-align: center">
                  Đang tải danh sách bài học...
                </p>
              </div>
            </div>
          </div>

          
       <!-- MÀN HÌNH 2: LUYỆN TẬP GÕ -->
          <div id="practiceSection" style="display: none; flex-direction: column; min-height: 500px; text-align: center">
            <div
              class="practice-header"
              style="
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 20px;
              "
            >
              <button
                onclick="backToList()"
                style="
                  background: none;
                  border: none;
                  font-size: 1rem;
                  cursor: pointer;
                  color: #4285f4;
                "
              >
                ←
              </button>

              <select
                id="practiceMode"
                onchange="renderQuestion()"
                style="
                  padding: 8px 12px;
                  border-radius: 8px;
                  border: 1px solid #ddd;
                  outline: none;
                  cursor: pointer;
                "
              >
                <option value="JP-VN">Tiếng Nhật → Tiếng Việt</option>
                <option value="VN-JP">Tiếng Việt → Tiếng Nhật</option>
              </select>
            </div>

            <div
              class="question-box"
              style="
                padding: 40px;
                background: #f8f9fa;
                border-radius: 12px;
                margin-bottom: 10px;
                border: 1px solid #eee;
                position: relative;
              "
            >
              <h3
                id="questionText"
                style="font-size: 3rem; margin: 0 0 10px 0; color: #2c3e50"
              >
                ...
              </h3>
              <p
                id="modeHint"
                style="color: #888; margin: 0; font-size: 1.1rem"
              >
                Hãy gõ nghĩa của từ này
              </p>

              <button
                onclick="showHint()"
                title="Gợi ý đáp án"
                style="
                  position: absolute;
                  top: 15px;
                  right: 15px;
                  background: none;
                  border: none;
                  font-size: 1.5rem;
                  cursor: pointer;
                "
              >
                💡
              </button>
              <p
                id="hintText"
                style="
                  display: none;
                  color: #f39c12;
                  font-weight: 600;
                  margin-top: 10px;
                "
              ></p>
            </div>

            <div
              class="practice-input-group"
              style="display: flex; gap: 10px; margin-bottom: 15px"
            >
              <input
                type="text"
                id="answerInput"
                placeholder="Nhập đáp án..."
                style="
                  flex: 1;
                  padding: 16px;
                  border: 2px solid #ddd;
                  border-radius: 8px;
                  font-size: 1.2rem;
                  outline: none;
                "
              />
              <button
                class="btn-d4c-primary submit-btn"
                onclick="checkAnswer()"
                style="
                  background: #4285f4;
                  color: white;
                  padding: 0 30px;
                  border: none;
                  border-radius: 8px;
                  font-weight: bold;
                  cursor: pointer;
                  font-size: 1.1rem;
                "
              >
                Kiểm tra
              </button>
            </div>

            <p
              id="feedbackMsg"
              style="
                min-height: 24px;
                font-weight: bold;
                margin-bottom: 20px;
                font-size: 1.1rem;
              "
            ></p>

            <!-- THANH ĐIỀU HƯỚNG: Đã được xử lý để luôn nằm dưới cùng -->
            <div
              style="
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 40px;
                margin-top: 10px; /* TUYỆT CHIÊU: Đẩy cụm này xuống kịch sàn */
                
                padding-bottom: 10px;
              "
            >
              <button
                onclick="backQuestion()"
                style="
                  background: #4285f4;
                  color: white;
                  width: 50px;
                  height: 50px;
                  border-radius: 50%;
                  border: none;
                  cursor: pointer;
                  font-size: 1.2rem;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  box-shadow: 0 4px 10px rgba(66, 133, 244, 0.3);
                  transition: transform 0.2s;
                "
                onmouseover="this.style.transform = 'scale(1.1)'"
                onmouseout="this.style.transform = 'scale(1)'"
              >
                ❮
              </button>

              <span
                id="questionCount"
                style="
                  font-weight: bold;
                  color: #666;
                  font-size: 1.2rem;
                  min-width: 80px;
                  text-align: center;
                "
                >1 / 10</span
              >

              <button
                onclick="nextQuestion()"
                style="
                  background: #4285f4;
                  color: white;
                  width: 50px;
                  height: 50px;
                  border-radius: 50%;
                  border: none;
                  cursor: pointer;
                  font-size: 1.2rem;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  box-shadow: 0 4px 10px rgba(66, 133, 244, 0.3);
                  transition: transform 0.2s;
                "
                onmouseover="this.style.transform = 'scale(1.1)'"
                onmouseout="this.style.transform = 'scale(1)'"
              >
                ❯
              </button>
            </div>
          </div>

  
    </div>

    <script src="js/vocab.js"></script>
  </body>
</html>
